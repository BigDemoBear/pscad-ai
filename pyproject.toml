[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pscad-ai"
version = "0.1.0"
description = "AI-oriented modeling and simulation automation for PSCAD 4.6.2"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "PSCAD AI contributors"}]
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "PyYAML==6.0.3",
  "Pillow==12.0.0",
  "pywin32==311; sys_platform == 'win32'",
]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
pscad-ai = "pscad_driver.cli:main"
pscad-tasks = "pscad_driver.tasks:main"
pscad-mcp = "pscad_mcp.server_sdk:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pscad_driver = ["assets/blank.pscx"]
